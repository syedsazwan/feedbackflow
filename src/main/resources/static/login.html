<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FeedbackFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page-body">
    <div class="login-card">
        <div class="login-header">
            <div class="logo-icon">FF</div>
            <h2>FeedbackFlow</h2>
            <p>Course Feedback Collection System</p>
        </div>

        <!-- Error Alert -->
        <div id="error-banner" class="alert-banner" style="margin-bottom: 20px;">
            <span id="error-message"></span>
        </div>

        <form id="login-form" novalidate onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username" class="form-label">
                    Username <span class="required">*</span>
                </label>
                <input type="text" id="username" class="form-input" placeholder="Enter username" required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    Password <span class="required">*</span>
                </label>
                <input type="password" id="password" class="form-input" placeholder="Enter password" required autocomplete="current-password">
            </div>

            <button type="submit" id="btn-login" class="btn-submit" style="width: 100%; justify-content: center; margin-top: 8px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                <span>Login</span>
            </button>
        </form>
    </div>

    <!-- Login JavaScript Logic -->
    <script src="js/login.js"></script>
</body>
</html>
