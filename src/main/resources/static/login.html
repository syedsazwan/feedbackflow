<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FeedbackFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-split-container">
        <!-- Left Hero Column -->
        <div class="login-left-brand">
            <div class="login-brand-top">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                </div>
                <div class="brand-text">
                    <h1>FeedbackFlow</h1>
                    <p>Course Feedback Collection System</p>
                </div>
            </div>

            <div class="login-hero-text">
                <h1>Your Feedback<br>Builds a Better<br><span>Tomorrow</span></h1>
                <p>Share your thoughts.<br>Improve courses.<br>Strengthen learning.</p>
            </div>

            <div class="login-left-footer">
                Academic Course Feedback & Evaluation Portal
            </div>
        </div>

        <!-- Right Form Column -->
        <div class="login-right-form">
            <div class="login-card-inner">
                <div class="login-card-header">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                    </div>
                    <h2>FeedbackFlow</h2>
                    <p>Course Feedback Collection System</p>
                </div>

                <!-- Error Alert Banner -->
                <div id="error-banner" class="alert-banner">
                    <span id="error-message"></span>
                </div>

                <form id="login-form" novalidate onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="username" class="form-label">
                            Username <span class="required">*</span>
                        </label>
                        <input type="text" id="username" class="form-input" placeholder="Enter username" required autofocus autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">
                            Password <span class="required">*</span>
                        </label>
                        <input type="password" id="password" class="form-input" placeholder="Enter password" required autocomplete="current-password">
                    </div>

                    <button type="submit" id="btn-login" class="btn-submit" style="width: 100%; justify-content: center; margin-top: 10px;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                        <span>Login</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Login JavaScript Logic -->
    <script src="js/login.js"></script>
</body>
</html>
